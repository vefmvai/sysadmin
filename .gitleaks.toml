# Правила поиска секретов для репозитория sysadmin (мозг агента).
#
# Используется pre-commit-хуком `.githooks/pre-commit` (блок 3) и любым ручным
# запуском `gitleaks` из корня репозитория.
#
# [extend] useDefault = true — стандартный набор gitleaks СОХРАНЯЕТСЯ, мы его дополняем.
#
# Зачем дополнять. Проверка 2026-07-22 на gitleaks 8.30.1: фальшивые ключи точного
# формата — приватный ключ PEM, токен GitHub, ключи OpenAI / Anthropic / OpenRouter —
# базовый набор ловит, а токен Telegram-бота проходит насквозь. А это ключ от бота
# целиком: кто им владеет, тот читает переписку бота и пишет от его имени.
#
# ВАЖНО при доработке правил: проверять их только строками ТОЧНОГО формата настоящих
# ключей и в отдельной песочнице. Фейк произвольной длины не совпадёт с regex, и
# «дыра» окажется артефактом теста, а не реальной. Отдельная ловушка —
# AKIAIOSFODNN7EXAMPLE: это официальный пример AWS, gitleaks игнорирует его намеренно.
[extend]
useDefault = true

[[rules]]
id = "telegram-bot-token"
description = "Токен Telegram-бота (идентификатор:секрет)"
# Формат: 8-12 цифр идентификатора бота, двоеточие, ровно 35 символов секрета.
regex = '''\b[0-9]{8,12}:[A-Za-z0-9_-]{35}\b'''
tags = ["telegram", "token"]

[[rules]]
id = "db-connection-string-with-password"
description = "Строка подключения к БД с паролем внутри (postgres/mysql/mongo/redis/amqp)"
# Стандартный набор gitleaks 8.30.1 такое пропускает — проверено живым прогоном 05.08.2026:
# `postgresql://user:pass@host:5432/db` уходил в коммит незамеченным. А это полный доступ
# к базе одной строкой, и такие строки регулярно попадают в .env, compose и документацию.
#
# Требуется ИМЕННО пара «логин:пароль@»: URI без пароля (`postgresql://localhost:5432/db`,
# `redis://cache:6379`, `postgresql://user@host/db`) под правило не подпадают — иначе замок
# ругался бы на каждый пример подключения в документации.
regex = '''\b(postgres(ql)?|mysql|mariadb|mongodb(\+srv)?|redis|rediss|amqps?|mssql|clickhouse)://[^:\s/@]{1,64}:[^@\s/]{6,}@'''
tags = ["database", "connection-string"]

# Место «пароля» занято не паролем, а подстановкой — это норма и в документации, и в
# compose-файлах. Без этого списка замок рвал бы правку любого примера подключения
# (проверено живьём 05.08.2026: `<password>` и `${DB_PASSWORD}` блокировались).
[[rules.allowlists]]
regexTarget = "line"
regexes = [
  '''://[^:@\s/]{1,64}:\$\{[^}]{1,64}\}@''',
  '''://[^:@\s/]{1,64}:\$[A-Za-z_][A-Za-z0-9_]{0,63}@''',
  '''://[^:@\s/]{1,64}:<[^>@\s]{1,64}>@''',
  '''://[^:@\s/]{1,64}:(password|PASSWORD|changeme|CHANGEME|secret|SECRET|\*+|xxx+|XXX+)@''',
]
